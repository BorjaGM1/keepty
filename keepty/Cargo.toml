[package]
name = "keepty"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Persistent PTY broker daemon. Spawns a command in a PTY, streams raw bytes to clients over a typed binary protocol."
repository.workspace = true

[[bin]]
name = "keepty"
path = "src/main.rs"

[dependencies]
keepty-screen = { version = "0.1.1", path = "../keepty-screen" }
keepty-protocol = { workspace = true }
portable-pty = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "term"] }
libc = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
vt100 = { workspace = true }
# Match keepty-screen's version for Screen::clone and Parser::screen_mut;
# leave the broker's vt100 dependency unchanged.
vt100-screen = { package = "vt100", version = "0.16.2" }
